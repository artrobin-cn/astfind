<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="活动现场合影示意">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#eef3f8"/>
      <stop offset="1" stop-color="#d7e1ec"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="38%" r="55%">
      <stop stop-color="#fff7e8" stop-opacity=".9"/>
      <stop offset="1" stop-color="#fff7e8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#bfcbd9"/>
      <stop offset="1" stop-color="#d7e1ec"/>
    </linearGradient>
    <linearGradient id="blazer" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#365777"/>
      <stop offset="1" stop-color="#203a58"/>
    </linearGradient>
    <linearGradient id="suitLeft" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#7d8f83"/>
      <stop offset="1" stop-color="#5d7065"/>
    </linearGradient>
    <linearGradient id="suitRight" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#c3a07e"/>
      <stop offset="1" stop-color="#9f7c5c"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#203047" flood-opacity=".16"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#bg)"/>
  <rect width="1200" height="800" fill="url(#glow)"/>
  <g filter="url(#soft)" opacity=".55">
    <circle cx="210" cy="170" r="58" fill="#ffffff"/>
    <circle cx="340" cy="120" r="34" fill="#dce8f5"/>
    <circle cx="940" cy="150" r="62" fill="#ffffff"/>
    <circle cx="1060" cy="230" r="38" fill="#e7d9c4"/>
    <circle cx="760" cy="110" r="26" fill="#f5e6cf"/>
  </g>
  <rect y="650" width="1200" height="150" fill="url(#floor)"/>
  <rect y="646" width="1200" height="4" fill="#ffffff" opacity=".55"/>

  <!-- left person -->
